# Kreatr — nginx vhost.
#
# Sits alongside the existing `financehub` vhost; nginx already owns 80/443 on
# this box, so Kreatr is a sibling server block rather than its own proxy.
#
# Everything is served from ONE hostname: the Next.js app at /, the FastAPI
# backend under /api/. That is deliberate. A split origin (app on https, API on
# http://ip:port) is blocked by the browser as mixed content, and `lib/api.ts`
# fails soft on a blocked request — so the workspace would quietly render seeded
# fixture data and look like a working demo showing invented numbers.
#
# Installed to /etc/nginx/sites-available/kreatr by deploy/provision.sh.
# Certbot rewrites this file when it issues the certificate; that is expected.

upstream kreatr_api {
    # api/main.py under systemd. 8000-8003 are already taken on this box.
    server 127.0.0.1:8010;
    keepalive 16;
}

upstream kreatr_web {
    # `next start`, loopback only — nginx is the sole public entry point.
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name KREATR_DOMAIN;

    # Source video uploads are the largest thing that crosses this proxy.
    # ffmpeg ingest happens after the body has landed, so this only bounds
    # the upload itself.
    client_max_body_size 512m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- The agent activity stream ---------------------------------------
    # SSE must be matched before the generic /api/ block. Buffering is the
    # thing that breaks it: with the default on, nginx accumulates the
    # response and the feed arrives in one lump when the run ends, which
    # reads as a hung UI for the whole run. The API also sends
    # X-Accel-Buffering: no, but stating it here means the stream survives
    # someone editing that header out.
    location ~ ^/api/runs/[^/]+/events$ {
        proxy_pass http://kreatr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # The stream idles for up to ~5 minutes by design (api/main.py holds
        # it open waiting for new log entries); the 60s default would cut it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- The API ----------------------------------------------------------
    location /api/ {
        proxy_pass http://kreatr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live run is many sequential Bedrock calls, and /api/runs/sync and
        # /api/content/upload both block until the work is done. Well past
        # the 60s default.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # --- The web app ------------------------------------------------------
    # Next.js serves its own hashed assets under /_next and sets its own cache
    # headers correctly, so this is a straight pass-through.
    location / {
        proxy_pass http://kreatr_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
